<!DOCTYPE html>
<html lang="id"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex, nofollow">
<title>Hubungi Kami | PT Karmand Mitra Andalan</title>
<link rel="stylesheet" href="css/theme.css"><link rel="stylesheet" href="css/site.css">
</head><body data-page="contact">
<div id="hdr"></div>
<main class="wrap">
 <div class="pagehead">
  <div class="eyebrow">Kontak</div>
  <h1>Hubungi Kami</h1>
  <p>Diskusikan kebutuhan produk kimia industri, penawaran harga, atau konsultasi teknis dengan tim kami.</p>
 </div>
 <section class="frame">
  <div class="contactgrid">
   <div>
    <h2 class="h-shelf" style="margin-bottom:18px">Kirim Pesan</h2>
    <form class="form" id="contact-form">
     <div class="frow">
      <div class="field"><label>Nama Lengkap *</label><input type="text" id="ct-name" required placeholder="Nama Anda"></div>
      <div class="field"><label>Email *</label><input type="email" id="ct-email" required placeholder="nama@perusahaan.com"></div>
     </div>
     <div class="frow">
      <div class="field"><label>No. Telepon / WhatsApp</label><input type="tel" id="ct-phone" placeholder="+62 8xx xxxx xxxx"></div>
      <div class="field"><label>Subjek *</label><input type="text" id="ct-subject" required placeholder="Permintaan penawaran / konsultasi"></div>
     </div>
     <div class="field"><label>Pesan *</label><textarea id="ct-message" required placeholder="Jelaskan kebutuhan produk, volume, atau kendala teknis Anda..."></textarea></div>
     <div><button class="btn" type="submit">Kirim Pesan</button></div>
    </form>
   </div>
   <div class="infobox" id="ct-info"></div>
  </div>
 </section>
</main>
<div id="ftr"></div>
<script src="js/data.js"></script><script src="js/site.js"></script>
</body></html>
