<!DOCTYPE html>
<html lang="id"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex, nofollow">
<title>Karir | PT Karmand Mitra Andalan</title>
<link rel="stylesheet" href="css/theme.css"><link rel="stylesheet" href="css/site.css">
</head><body data-page="career">
<div id="hdr"></div>
<main class="wrap">
 <div class="pagehead">
  <div class="eyebrow">Karir</div>
  <h1>Bergabung Bersama Kami</h1>
  <p>Bangun karir Anda di industri kimia bersama tim teknis dan profesional yang berfokus pada kualitas, inovasi, dan keberlanjutan.</p>
 </div>
 <section class="frame">
  <div class="head"><h2 class="h-frame">Mengapa Bekerja di Karmand</h2></div>
  <div class="bengrid" id="car-ben"></div>
 </section>
 <section class="frame" style="border-top:1px solid var(--line)">
  <div class="head"><h2 class="h-frame">Lowongan Tersedia</h2><button class="btn outline" id="btn-gen-apply" type="button">Kirim Lamaran Umum</button></div>
  <div class="toolbar" style="padding-top:0">
   <div class="tabs" id="car-tabs"></div>
   <input class="search" id="car-search" type="search" placeholder="Cari posisi atau lokasi...">
  </div>
  <div class="jobgrid" id="car-grid"></div>
 </section>
</main>
<div class="modal" id="apply-modal" role="dialog" aria-modal="true" aria-labelledby="apply-title">
 <div class="modal-box">
  <div class="modal-head"><h3 id="apply-title">Lamar Posisi</h3><button class="modal-x" id="apply-close" type="button" aria-label="Tutup">&times;</button></div>
  <form class="form" id="apply-form">
   <input type="hidden" id="ap-job-id">
   <div class="field"><label>Posisi yang Dilamar</label><input type="text" id="ap-pos" required></div>
   <div class="frow">
    <div class="field"><label>Nama Lengkap *</label><input type="text" id="ap-name" required></div>
    <div class="field"><label>Email *</label><input type="email" id="ap-email" required></div>
   </div>
   <div class="frow">
    <div class="field"><label>No. Telepon / WhatsApp *</label><input type="tel" id="ap-phone" required></div>
    <div class="field"><label>Pendidikan Terakhir</label><input type="text" id="ap-edu" placeholder="Contoh: S1 Teknik Kimia"></div>
   </div>
   <div class="field"><label>Pengalaman Kerja</label><input type="text" id="ap-exp" placeholder="Contoh: 3 tahun di sales industri"></div>
   <div class="field"><label>Ringkasan / Cover Letter *</label><textarea id="ap-cover" required placeholder="Ceritakan pengalaman dan motivasi Anda..."></textarea></div>
   <button class="btn" type="submit">Kirim Lamaran</button>
  </form>
 </div>
</div>
<div id="ftr"></div>
<script src="js/data.js"></script><script src="js/site.js"></script>
</body></html>
