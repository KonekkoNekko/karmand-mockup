<!DOCTYPE html>
<html lang="id"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex, nofollow">
<title>Blogs &amp; Artikel | PT Karmand Mitra Andalan</title>
<link rel="stylesheet" href="css/theme.css"><link rel="stylesheet" href="css/site.css">
</head><body data-page="blogs">
<div id="hdr"></div>
<main class="wrap">
 <div class="pagehead">
  <h1>Artikel Kimia Industri &amp; Studi Lapangan</h1>
  <p>Panduan praktis pemilihan coating, pencegahan korosi, pengolahan air boiler, serta pemeliharaan peralatan industri.</p>
 </div>
 <div class="toolbar">
  <div class="tabs" id="blog-tabs"></div>
  <input class="search" id="blog-search" type="search" placeholder="Cari artikel...">
 </div>
 <div class="fgrid" id="blog-grid"></div>
 <div class="nlbox">
  <div>
   <div class="eyebrow">Newsletter</div>
   <h2 class="h-shelf" style="margin-top:4px">Dapatkan artikel teknis terbaru</h2>

  </div>
  <form class="nlform" id="nl-form">
   <input type="email" id="nl-email" required placeholder="nama@perusahaan.com" aria-label="Email newsletter">
   <button class="btn" type="submit">Berlangganan</button>
  </form>
 </div>
</main>
<div id="ftr"></div>
<script src="js/data.js"></script><script src="js/site.js"></script>
