<!DOCTYPE html>
<html lang="id"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex, nofollow">
<title>Admin Login | PT Karmand Mitra Andalan</title>
<link rel="stylesheet" href="../css/theme.css"><link rel="stylesheet" href="../css/admin.css">
</head><body>
<div class="login-shell">
 <div class="login-card">
  <img class="logo" src="../assets/logo.png" alt="PT Karmand Mitra Andalan">
  <h1>Admin Panel</h1>
  <p>Masuk untuk mengelola konten website, katalog produk, portofolio, dan kotak masuk.</p>
  <form class="form" id="login-form">
   <div class="field"><label>Email</label><input type="email" id="em" required value="admin@example.com"></div>
   <div class="field"><label>Password</label><input type="password" id="pw" required value="password"></div>
   <button class="btn" type="submit" style="width:100%">Masuk ke Dashboard</button>
   <a class="btn outline" href="../index.html" style="width:100%">Kembali ke Website</a>
  </form>
  <div class="login-hint">Akun demo: <b>admin@example.com</b> / <b>password</b></div>
 </div>
</div>
<script>
document.getElementById('login-form').onsubmit = function (e) {
  e.preventDefault();
  try { localStorage.setItem('km_mockup_admin_auth', JSON.stringify({ email: document.getElementById('em').value.trim(), name: 'Admin Karmand' })); } catch (err) {}
  location.href = 'index.html#dashboard';
};
</script>
</body></html>
